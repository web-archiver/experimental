[package]
name = "webar-http-lib"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
anyhow.workspace = true
const-hex.workspace = true
tar.workspace = true
rustix = { workspace = true, features = ["runtime", "process", "thread"] }
rustls = "0.23.21"
webpki-roots = "1.0.7"
# logging
valuable.workspace = true
tracing.workspace = true
serde = { version = "1.0.219", features = ["derive"] }
ciborium = "0.2.2"
tracing-serde = { version = "0.2.0", features = ["valuable"] }
tracing-subscriber = { version = "0.3.19", features = [
  "fmt",
  "env-filter",
  "valuable",
  "json",
] }
indicatif.workspace = true
tracing-indicatif.workspace = true
uuid = { workspace = true, features = ["v4", "v7"] }
http = "1.2.0"
reqwest.workspace = true
bytes = "1.10.1"
http-body = "1.0.1"
mime = "0.3.17"
mime-data = { git = "https://github.com/Forist2034/mime-data-rs", version = "0.1.0" }
infer = "0.19.0"
serde_json = "1.0.140"
tokio = { version = "1.43.0", features = ["rt-multi-thread"] }
webar-core.workspace = true
webar-http-lib-core = { path = "../core" }
tower-service = "0.3.3"
hyper = "1.10.1"
hyper-util = { version = "0.1.20", features = [
  "http1",
  "http2",
  "client",
  "tokio",
  "tracing",
] }
pin-project = "1.1.13"
tower = { version = "0.5.3", features = ["util"] }
thiserror.workspace = true
libc = "0.2.186"
hyper-rustls = { version = "0.27.9", features = ["http2"] }
http-body-util = "0.1.3"
