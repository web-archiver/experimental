[package]
name = "webar-http-lib"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
anyhow.workspace = true
const-hex.workspace = true
rustix = { workspace = true, features = ["runtime", "thread", "system", "net"] }
rustls = "0.23.21"
webpki-roots = "1.0.7"
# logging
valuable.workspace = true
tracing.workspace = true
serde = { version = "1.0.219", features = ["derive"] }
ciborium = "0.2.2"
tracing-serde = { version = "0.2.0", features = ["valuable"] }
tracing-subscriber = { version = "0.3.19", features = [
  "fmt",
  "env-filter",
  "valuable",
  "json",
] }
indicatif.workspace = true
tracing-indicatif.workspace = true
uuid = { workspace = true, features = ["v4", "v7", "v8"] }
http = "1.2.0"
bytes = "1.10.1"
http-body = "1.0.1"
mime = "0.3.17"
mime-data = { git = "https://github.com/Forist2034/mime-data-rs", version = "0.1.0" }
infer = "0.19.0"
serde_json = "1.0.140"
tokio = { workspace = true, features = ["rt-multi-thread", "net"] }
webar-core.workspace = true
webar-http-lib-core = { path = "../core" }
tower-service = "0.3.3"
hyper = "1.10.1"
hyper-util = { version = "0.1.20", features = [
  "http1",
  "http2",
  "client",
  "tokio",
  "tracing",
] }
pin-project = "1.1.13"
tower = { version = "0.5.3", features = ["retry", "limit", "util"] }
thiserror.workspace = true
libc = "0.2.186"
hyper-rustls = { version = "0.27.9", features = ["http2"] }
http-body-util = "0.1.3"
cookie_store = { version = "0.22.1", default-features = false, features = [
  "public_suffix",
  "preserve_order",
] }
url = "2.5.8"
tokio-rustls = "0.26.4"
brotli = "8.0.4"
flate2 = "1.1.9"
zstd = "0.13.3"
webar-target-info = { version = "0.1.0", path = "../target-info" }
cookie = "0.18.1"
time = "0.3.53"
publicsuffix = "2.3.0"
webar-direct-connector = { version = "0.1.0", path = "../direct-connector", default-features = false, features = [
  "client",
] }
httpdate = "1.0.3"
